<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reservation Confirmed | YGT Executive Limo</title><link rel="stylesheet" href="styles.css"></head><body class="status-page"><main class="status-card"><img src="assets/logo.png" alt="YGT Executive Limo"><p class="kicker">Payment successful</p><h1>Your ride is confirmed.</h1><p id="statusText">Loading your reservation details…</p><div id="confirmation" class="confirmation-box" hidden></div><a class="btn btn-gold" href="index.html">Return Home</a></main><script>
const p=new URLSearchParams(location.search);const id=p.get('session_id');const box=document.getElementById('confirmation');const text=document.getElementById('statusText');
if(!id){text.textContent='Reservation session not found.'}else{fetch('/api/get-session?session_id='+encodeURIComponent(id)).then(r=>r.json().then(d=>({ok:r.ok,d}))).then(({ok,d})=>{if(!ok)throw new Error(d.error);text.textContent='A confirmation has been sent to '+(d.customerEmail||'your email')+'.';box.hidden=false;box.innerHTML='<strong>Reservation '+d.reservationId+'</strong><span>'+d.metadata.vehicle+'</span><span>'+d.metadata.route+'</span><span>'+d.metadata.date+' at '+d.metadata.time+'</span><span>Total paid: $'+(d.amount/100).toFixed(2)+'</span>'}).catch(e=>text.textContent=e.message)}
</script></body></html>
