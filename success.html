<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><title>Reservation Confirmed | YGT Executive Limo</title></head>
<body><main class="statusPage"><section class="statusCard">
<span class="eyebrow">Payment successful</span>
<h1>Your ride is confirmed.</h1>
<p id="reservationText">Your reservation has been received.</p>
<div class="confirmationDetails">
  <div><span>Payment</span><strong>Paid securely with Stripe</strong></div>
  <div><span>Confirmation</span><strong>Email receipt and booking details</strong></div>
  <div><span>Next step</span><strong>Chauffeur details before pickup</strong></div>
</div>
<p>Keep your reservation number for any changes or questions.</p>
<a class="goldBtn" href="/">Return to website</a>
</section></main>
<script>
const reservation=new URLSearchParams(location.search).get("reservation");
if(reservation)document.getElementById("reservationText").innerHTML=`Reservation number: <strong>${reservation}</strong>`;
</script></body></html>
