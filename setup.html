<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YGT System Status</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="statusPage"><section class="statusCard setupCard"><span class="eyebrow">System Status</span><h1>Booking connections</h1><div id="statusList" class="statusList">Checking…</div><a href="/" class="goldBtn">Return to website</a></section></main>
<script>
fetch("/api/system-status").then(r=>r.json()).then(s=>{
 const items=[
  ["Google address search",s.googleBrowserKey],
  ["Google distance & ETA",s.googleServerKey],
  ["Stripe checkout",s.stripeKey],
  ["Stripe payment confirmation",s.stripeWebhook],
  ["Booking confirmation email",s.resendKey],
  ["Website return URL",s.siteUrl],
  ["Reservation database",s.supabase],
  ["Admin dashboard access",s.adminToken]
 ];
 document.getElementById("statusList").innerHTML=items.map(([n,v])=>`<div><span>${n}</span><strong class="${v?"ok":"missing"}">${v?"Connected":"Needs setup"}</strong></div>`).join("");
});
</script></body></html>
